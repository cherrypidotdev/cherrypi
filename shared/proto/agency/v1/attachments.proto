syntax = "proto3";

package agency.v1;

import "google/protobuf/timestamp.proto";






message Attachment {
  int64 id = 1;
  string filename = 2;
  string content_type = 3;
  int64 size = 4;
  string url = 5;
  google.protobuf.Timestamp created_at = 6;
  string created_by = 7;
}
