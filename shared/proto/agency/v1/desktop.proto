syntax = "proto3";

package agency.v1;

import "agent/v1/desktop.proto";

// DesktopService is the agency-facing, agent-scoped view of the worker's
// already-running desktop. GetDesktop forwards over the tunnel; the RFB data
// plane is a WebSocket the agency relays at
// /api/agents/<agent_id>/desktop/ws.
service DesktopService {
  rpc GetDesktop(GetDesktopRequest) returns (GetDesktopResponse);
}

message GetDesktopRequest {
  string agent_id = 1;
}

message GetDesktopResponse {
  bool available = 1;
  string unavailable_reason = 2;
  agent.v1.Desktop desktop = 3;
  // Agency-side WebSocket path, e.g. /api/agents/<agent_id>/desktop/ws.
  string ws_path = 4;
}
