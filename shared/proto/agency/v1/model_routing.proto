syntax = "proto3";

package agency.v1;

import "agency/v1/task.proto";





service ModelRoutingService {
  rpc GetOrganizationModelRouting(GetOrganizationModelRoutingRequest) returns (GetOrganizationModelRoutingResponse);
  
  rpc UpdateOrganizationModelRouting(UpdateOrganizationModelRoutingRequest) returns (UpdateOrganizationModelRoutingResponse);
  rpc GetProjectModelRouting(GetProjectModelRoutingRequest) returns (GetProjectModelRoutingResponse);
  
  rpc UpdateProjectModelRouting(UpdateProjectModelRoutingRequest) returns (UpdateProjectModelRoutingResponse);
  
  
  rpc PreviewModelRouting(PreviewModelRoutingRequest) returns (PreviewModelRoutingResponse);
  
  
  
  rpc ListRoutingModels(ListRoutingModelsRequest) returns (ListRoutingModelsResponse);
}



message ModelSelection {
  string provider = 1;
  string model_id = 2;
  
  
  string model_name = 3;
  
  
  
  string thinking_level = 4;
}



message ModelRoute {
  
  TaskPriority priority = 1;
  
  TaskSize size = 2;
  
  
  string tag = 3;
  ModelSelection model = 4;
}




message OrganizationModelRouting {
  ModelSelection default_model = 1;
  repeated ModelRoute routes = 2;
}



message ProjectModelRouting {
  ModelSelection default_model = 1;
  
  repeated ModelRoute tag_pins = 2;
  repeated ModelRoute routes = 3;
}

message GetOrganizationModelRoutingRequest {}

message GetOrganizationModelRoutingResponse {
  OrganizationModelRouting routing = 1;
}

message UpdateOrganizationModelRoutingRequest {
  OrganizationModelRouting routing = 1;
}

message UpdateOrganizationModelRoutingResponse {
  OrganizationModelRouting routing = 1;
}

message GetProjectModelRoutingRequest {
  string project_id = 1;
}

message GetProjectModelRoutingResponse {
  ProjectModelRouting routing = 1;
}

message UpdateProjectModelRoutingRequest {
  string project_id = 1;
  ProjectModelRouting routing = 2;
}

message UpdateProjectModelRoutingResponse {
  ProjectModelRouting routing = 1;
}

message PreviewModelRoutingRequest {
  string project_id = 1;
  TaskPriority priority = 2;
  TaskSize size = 3;
  repeated string tags = 4;
}

message PreviewModelRoutingResponse {
  
  ModelSelection model = 1;
  
  
  string scope = 2;
  
  int32 rule = 3;
}

message RoutingModel {
  string provider = 1;
  string model_id = 2;
  string name = 3;
  
  
  
  
  repeated string thinking_levels = 4;
}

message ListRoutingModelsRequest {
  
  string project_id = 1;
}

message ListRoutingModelsResponse {
  repeated RoutingModel models = 1;
}
