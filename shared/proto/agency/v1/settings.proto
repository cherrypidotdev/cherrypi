syntax = "proto3";

package agency.v1;

import "agency/v1/attachments.proto";



service SettingsService {
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);
}

message Settings {
  
  string agency_name = 1;
  
  
  string primary_color = 2;
  
  
  Attachment logo = 3;
  
  
  Attachment favicon = 4;
  
  
  bool show_usage_kpi = 5;
  
  
  bool show_concurrency_kpi = 6;
  
  
  
  string notification_sound_set = 7;
  
  VoiceInput voice_input = 8;
}




message VoiceInput {
  
  bool enabled = 1;
  
  
  string base_url = 2;
  
  string model = 3;
  
  
  
  bool has_api_key = 4;
  
  
  bool server_configured = 5;
}

message GetSettingsRequest {}

message GetSettingsResponse {
  Settings settings = 1;
}

message UpdateSettingsRequest {
  Settings settings = 1;
  
  
  string voice_input_api_key = 2;
  
  
  
  bool clear_api_key = 3;
}

message UpdateSettingsResponse {
  Settings settings = 1;
}
