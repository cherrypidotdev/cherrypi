syntax = "proto3";

package agency.v1;

import "agency/v1/attachments.proto";

// SettingsService stores agency-wide configuration in the key-value `settings`
// table; the proto exposes typed fields.
service SettingsService {
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);
}

message Settings {
  // Display name shown in the agency shell next to the cherry icon.
  string agency_name = 1;
  // Accent as `#rrggbb`. Empty uses the built-in default; the foreground text
  // color is derived for contrast.
  string primary_color = 2;
  // The agency logo shown in the shell, unset when the bundled default artwork
  // is used.
  Attachment logo = 3;
  // The browser favicon, unset when it falls back to the logo (and then to the
  // bundled default artwork).
  Attachment favicon = 4;
}

message GetSettingsRequest {}

message GetSettingsResponse {
  Settings settings = 1;
}

message UpdateSettingsRequest {
  Settings settings = 1;
}

message UpdateSettingsResponse {
  Settings settings = 1;
}
