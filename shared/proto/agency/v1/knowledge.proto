syntax = "proto3";

package agency.v1;

import "google/protobuf/timestamp.proto";















service KnowledgeService {
  rpc ListKnowledge(ListKnowledgeRequest) returns (ListKnowledgeResponse);
  rpc GetKnowledge(GetKnowledgeRequest) returns (GetKnowledgeResponse);
  rpc AddKnowledge(AddKnowledgeRequest) returns (AddKnowledgeResponse);
  rpc UpdateKnowledge(UpdateKnowledgeRequest) returns (UpdateKnowledgeResponse);
  
  
  rpc ApproveKnowledge(ApproveKnowledgeRequest)
      returns (ApproveKnowledgeResponse);
  rpc RejectKnowledge(RejectKnowledgeRequest) returns (RejectKnowledgeResponse);
  rpc DeleteKnowledge(DeleteKnowledgeRequest) returns (DeleteKnowledgeResponse);
  rpc ListKnowledgeRevisions(ListKnowledgeRevisionsRequest)
      returns (ListKnowledgeRevisionsResponse);
  
  
  rpc SearchKnowledge(SearchKnowledgeRequest) returns (SearchKnowledgeResponse);
  rpc ListKnowledgeTags(ListKnowledgeTagsRequest)
      returns (ListKnowledgeTagsResponse);

  
  
  rpc GetMemoryContext(GetMemoryContextRequest)
      returns (GetMemoryContextResponse);
  rpc WriteMemory(WriteMemoryRequest) returns (WriteMemoryResponse);
  rpc ForgetMemory(ForgetMemoryRequest) returns (ForgetMemoryResponse);
  rpc RestoreMemory(RestoreMemoryRequest) returns (RestoreMemoryResponse);
  rpc Scratchpad(ScratchpadRequest) returns (ScratchpadResponse);
  rpc GetMemoryStatus(GetMemoryStatusRequest) returns (GetMemoryStatusResponse);
  rpc SearchMemory(SearchMemoryRequest) returns (SearchMemoryResponse);

  
  rpc ListAgentMemory(ListAgentMemoryRequest) returns (ListAgentMemoryResponse);
  rpc GetAgentMemoryFile(GetAgentMemoryFileRequest)
      returns (GetAgentMemoryFileResponse);
}



message KnowledgeBit {
  string id = 1;
  
  string project_id = 2;
  
  string project_slug = 3;
  string title = 4;
  string content = 5;
  repeated string tags = 6;
  
  string status = 7;
  
  
  string origin_task_id = 8;
  string created_by_actor_id = 9;
  
  string created_by = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  string reviewed_by_actor_id = 13;
  string reviewed_by = 14;
  google.protobuf.Timestamp reviewed_at = 15;
  string review_note = 16;
  int64 revision = 17;
  int32 content_size = 18;
  
  string superseded_by_id = 19;
  repeated KnowledgeSource sources = 20;
  repeated KnowledgeLink links = 21;
  repeated KnowledgeLink backlinks = 22;
  repeated KnowledgeRevision revisions = 23;
  bool can_edit = 24;
  bool can_review = 25;
  bool can_delete = 26;
}


message KnowledgeSource {
  int64 id = 1;
  
  string kind = 2;
  string task_id = 3;
  
  string message_id = 4;
  
  string request_id = 5;
  
  string question_id = 6;
  
  string answered_by_actor_id = 7;
  string answered_by = 8;
  
  int64 prompt_id = 9;
  
  string prompt_scope = 10;
  
  string prompt_target_id = 11;
  
  string label = 12;
  google.protobuf.Timestamp at = 13;
  
  string href = 14;
}


message KnowledgeLink {
  string knowledge_id = 1;
  string title = 2;
  string project_id = 3;
  string status = 4;
  
  string kind = 5;
}


message KnowledgeRevision {
  int64 id = 1;
  int64 revision = 2;
  string title = 3;
  string content = 4;
  repeated string tags = 5;
  string status = 6;
  string actor_id = 7;
  string actor_ref = 8;
  string summary = 9;
  google.protobuf.Timestamp created_at = 10;
}



message KnowledgeSourceInput {
  string kind = 1;
  string task_id = 2;
  string message_id = 3;
  string request_id = 4;
  string question_id = 5;
  int64 prompt_id = 6;
}

message KnowledgeTag {
  string tag = 1;
  int32 count = 2;
}

message ListKnowledgeRequest {
  
  string scope = 1;
  string project_id = 2;
  string tag = 3;
  
  string status = 4;
  string query = 5;
  
  string task_id = 6;
  string author_actor_id = 7;
  int32 limit = 8;
  int32 offset = 9;
}

message ListKnowledgeResponse {
  repeated KnowledgeBit bits = 1;
}

message GetKnowledgeRequest {
  string id = 1;
}

message GetKnowledgeResponse {
  KnowledgeBit bit = 1;
}

message AddKnowledgeRequest {
  
  
  optional string project_id = 1;
  string title = 2;
  string content = 3;
  repeated string tags = 4;
  repeated KnowledgeSourceInput sources = 5;
  repeated string related_ids = 6;
  repeated string supersedes_ids = 7;
  
  string origin_task_id = 8;
}

message AddKnowledgeResponse {
  KnowledgeBit bit = 1;
}

message UpdateKnowledgeRequest {
  string id = 1;
  
  int64 base_revision = 2;
  optional string title = 3;
  optional string content = 4;
  repeated string tags = 5;
  bool replace_tags = 6;
  repeated KnowledgeSourceInput sources = 7;
  bool replace_sources = 8;
  repeated string related_ids = 9;
  bool replace_related = 10;
  repeated string supersedes_ids = 11;
  bool replace_supersedes = 12;
  string summary = 13;
}

message UpdateKnowledgeResponse {
  KnowledgeBit bit = 1;
}

message ApproveKnowledgeRequest {
  string id = 1;
  string note = 2;
}

message ApproveKnowledgeResponse {
  KnowledgeBit bit = 1;
}

message RejectKnowledgeRequest {
  string id = 1;
  string note = 2;
}

message RejectKnowledgeResponse {
  KnowledgeBit bit = 1;
}

message DeleteKnowledgeRequest {
  string id = 1;
}

message DeleteKnowledgeResponse {}

message ListKnowledgeRevisionsRequest {
  string id = 1;
}

message ListKnowledgeRevisionsResponse {
  repeated KnowledgeRevision revisions = 1;
}

message SearchKnowledgeRequest {
  string query = 1;
  string project_id = 2;
  string tag = 3;
  
  string status = 4;
  int32 limit = 5;
  
  string scope = 6;
}

message SearchKnowledgeResponse {
  repeated KnowledgeBit bits = 1;
}

message ListKnowledgeTagsRequest {
  string project_id = 1;
  string scope = 2;
}

message ListKnowledgeTagsResponse {
  repeated KnowledgeTag tags = 1;
}


message MemoryFile {
  string path = 1;
  string title = 2;
  string body = 3;
  string status = 4;
  string trust_tier = 5;
  int64 revision = 6;
  string generated_by_actor_id = 7;
  string generated_by = 8;
  google.protobuf.Timestamp generated_at = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  int32 body_size = 12;
}

message MemoryLayer {
  string name = 1;
  string path = 2;
  int32 chars = 3;
  bool truncated = 4;
}

message GetMemoryContextRequest {
  string project_id = 1;
}

message GetMemoryContextResponse {
  string text = 1;
  string hash = 2;
  google.protobuf.Timestamp snapshot_at = 3;
  string project_id = 4;
  repeated MemoryLayer layers = 5;
}

message WriteMemoryRequest {
  string project_id = 1;
  
  string target = 2;
  string path = 3;
  string content = 4;
  bool replace = 5;
}

message WriteMemoryResponse {
  MemoryFile file = 1;
  
  
  bool snapshot_dirty = 2;
}

message ForgetMemoryRequest {
  string query = 1;
}

message ForgetMemoryResponse {
  string recovery_id = 1;
  int32 files = 2;
  int32 entries = 3;
}

message RestoreMemoryRequest {
  string recovery_id = 1;
}

message RestoreMemoryResponse {
  int32 restored_files = 1;
}

message ScratchpadRequest {
  
  string action = 1;
  string text = 2;
}

message ScratchpadResponse {
  string content = 1;
}

message GetMemoryStatusRequest {
  string project_id = 1;
}

message GetMemoryStatusResponse {
  string project_id = 1;
  string today_path = 2;
  int32 total_chars = 3;
  repeated MemoryFile files = 4;
  GetMemoryContextResponse context = 5;
}

message SearchMemoryRequest {
  string query = 1;
  int32 limit = 2;
}

message SearchMemoryResponse {
  repeated MemoryFile files = 1;
}

message ListAgentMemoryRequest {
  
  string agent_id = 1;
}

message ListAgentMemoryResponse {
  repeated MemoryFile files = 1;
}

message GetAgentMemoryFileRequest {
  string agent_id = 1;
  string path = 2;
}

message GetAgentMemoryFileResponse {
  MemoryFile file = 1;
}