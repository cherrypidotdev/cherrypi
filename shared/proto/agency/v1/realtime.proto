syntax = "proto3";

package agency.v1;








service RealtimeService {
  
  
  
  rpc Watch(WatchRequest) returns (stream WatchResponse);
}

message WatchRequest {}

message WatchResponse {
  RealtimeEvent event = 1;
}



message RealtimeEvent {
  RealtimeKind kind = 1;
}


enum RealtimeKind {
  REALTIME_KIND_UNSPECIFIED = 0;
  
  REALTIME_KIND_SYNC = 1;
  
  REALTIME_KIND_TASKS = 2;
  
  REALTIME_KIND_USAGE = 3;
  
  REALTIME_KIND_TERMINALS = 4;
  
  REALTIME_KIND_AGENT_LOGS = 5;
  
  REALTIME_KIND_AGENTS = 6;
}
