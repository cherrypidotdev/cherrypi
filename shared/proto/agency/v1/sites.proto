syntax = "proto3";

package agency.v1;

import "google/protobuf/timestamp.proto";




service SiteService {
  rpc ListSites(ListSitesRequest) returns (ListSitesResponse);
  rpc GetSite(GetSiteRequest) returns (GetSiteResponse);
  
  
  
  rpc UpdateSite(UpdateSiteRequest) returns (UpdateSiteResponse);
  rpc DeleteSite(DeleteSiteRequest) returns (DeleteSiteResponse);
}




message Site {
  
  string id = 1;
  string title = 2;
  string description = 3;
  
  
  
  bool only_creator_may_edit = 4;
  
  
  
  bool agency_wide = 5;
  
  string creator_actor_id = 6;
  string creator_name = 7;
  string creator_username = 8;
  string creator_picture_url = 9;
  
  
  string origin_task_id = 10;
  string url = 11;
  string content_url = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  
  bool can_edit = 15;
  bool can_delete = 16;
}

message ListSitesRequest {
  
  string origin_task_id = 1;
  
  bool agency_wide_only = 2;
}

message ListSitesResponse {
  repeated Site sites = 1;
}

message GetSiteRequest {
  string id = 1;
}

message GetSiteResponse {
  Site site = 1;
}

message UpdateSiteRequest {
  string id = 1;
  
  optional string title = 2;
  optional string description = 3;
  optional bool only_creator_may_edit = 4;
  optional bool agency_wide = 5;
}

message UpdateSiteResponse {
  Site site = 1;
}

message DeleteSiteRequest {
  string id = 1;
}

message DeleteSiteResponse {}
