syntax = "proto3";

package tunnel.v1;

// TunnelService is the single long-lived stream an agent opens to the agency.
// The agent is the Connect client and the agency is the server. The stream is
// a full-duplex byte pipe: the agent runs its HTTP API over it with yamux, so
// the agency reuses its generated Connect clients and the agent keeps its
// existing HTTP handlers (including WebSocket upgrades for terminals).
//
// The agent authenticates with one of its tunnel credentials via basic auth.
service TunnelService {
  rpc Connect(stream Frame) returns (stream Frame);
}

// Frame is one chunk of the tunnel byte stream, or the agent's opening hello.
message Frame {
  bytes data = 1;
  // Hello is set on the first frame the agent sends after authenticating, and
  // must be the first message on the stream. The agency validates it before it
  // establishes the yamux pipe, so it is never part of the byte stream. An
  // agent that does not send one (a binary older than the handshake) is
  // refused; see docs/agent-compat.md.
  Hello hello = 2;
}

// Hello is the agent's opening handshake: what it is and what it speaks.
message Hello {
  // Agent build version (the git-describe stamp baked into the image), for
  // operators to identify the exact binary.
  string build_version = 1;
  // Agent↔agency protocol version (semver); compatibility is judged on this.
  // It is empty only for a binary that predates the handshake.
  string protocol_version = 2;
}
