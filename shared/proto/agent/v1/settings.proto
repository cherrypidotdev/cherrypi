syntax = "proto3";

package agent.v1;

// SettingsService stores agent configuration. It is backed by the key-value
// `settings` table; the proto exposes typed fields.
service SettingsService {
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);
}

message Settings {
  // Display name shown in the dashboard sidebar next to the cherry icon.
  string agent_name = 1;
  // Dashboard primary accent as `#rrggbb`. Empty uses the built-in default
  // (near-black); the foreground text color is derived for contrast.
  string primary_color = 2;
}

message GetSettingsRequest {}

message GetSettingsResponse {
  Settings settings = 1;
}

message UpdateSettingsRequest {
  Settings settings = 1;
}

message UpdateSettingsResponse {
  Settings settings = 1;
}
