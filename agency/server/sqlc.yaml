version: "2"

# Two engines, one logical schema. The generated packages expose their own
# params/rows; internal/store/gen derives neutral store types and converters
# for the types that match, while dialect-specific query types stay local.
# SQLite is the default; PostgreSQL is selected by DATABASE_DSN at runtime.
sql:
  - engine: sqlite
    schema: sql/sqlite/migrations
    queries: sql/sqlite/queries

    gen:
      go:
        package: sqlitedb
        out: internal/gen/sqlite
        emit_interface: true

  - engine: postgresql
    schema: sql/pg/migrations
    queries: sql/pg/queries

    gen:
      go:
        package: pgdb
        out: internal/gen/pg
        sql_package: database/sql
        emit_interface: true
