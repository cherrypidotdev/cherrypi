# Static host for the standalone VitePress documentation image (docs.cherrypi.dev).
# Mirrors the clean-URL resolution of the agency's embedded /docs handler.

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  # VitePress cleanUrls emits <path>.html, so serve extensionless URLs from it.
  location / {
    expires -1;
    try_files $uri $uri.html $uri/ =404;
  }

  # VitePress assets are content-hashed and safe to cache forever.
  location ^~ /assets/ {
    access_log off;
    expires 1y;
    try_files $uri =404;
  }

  # Unhashed artwork (screenshots, logo, icons) revalidates weekly.
  location ~* \.(?:png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot)$ {
    expires 7d;
    try_files $uri =404;
  }

  # HTML must revalidate so a new release is visible immediately.
  location ~* \.html$ {
    expires -1;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
}
