name: Bug report
description: Something is broken in CherryPi
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste credentials, tokens, or other
        secrets: redact them first.
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag or image tag you are running (the dashboard footer shows it).
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Agency (server / dashboard)
        - Agent
        - SDK
        - Container image
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Agency or agent logs, with secrets redacted.
      render: shell
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Host OS and architecture, database (SQLite or PostgreSQL), and how it runs (compose, binary, …).
    validations:
      required: false
