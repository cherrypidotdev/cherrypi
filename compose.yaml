name: cherrypi-agency

services:
  agency:
    build:
      context: .
      dockerfile: agency/server/Dockerfile
      args:
        VERSION: ${VERSION:-}
    image: cherrypi-agency
    restart: unless-stopped
    depends_on:
      - minio
    ports:
      - "8080:8080"
    environment:
      CHERRYPI_ADMIN_USERNAME: ${CHERRYPI_ADMIN_USERNAME:-admin}
      CHERRYPI_ADMIN_PASSWORD: ${CHERRYPI_ADMIN_PASSWORD:-deadbeef}

      CHERRYPI_S3_ENDPOINT: ${CHERRYPI_S3_ENDPOINT:-http://minio:9000}
      CHERRYPI_S3_BUCKET: ${CHERRYPI_S3_BUCKET:-cherrypi}
      CHERRYPI_S3_ACCESS_KEY_ID: ${CHERRYPI_S3_ACCESS_KEY_ID:-cherrypi}
      CHERRYPI_S3_SECRET_ACCESS_KEY: ${CHERRYPI_S3_SECRET_ACCESS_KEY:-cherrypi-dev}
      CHERRYPI_S3_FORCE_PATH_STYLE: "true"
    volumes:
      - ./agency_home:/root

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cherrypi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cherrypi-dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cherrypi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cherrypi-dev}
      CHERRYPI_S3_BUCKET: ${CHERRYPI_S3_BUCKET:-cherrypi}
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 1; done;
        mc mb --ignore-existing "local/$$CHERRYPI_S3_BUCKET"

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    image: cherrypi-agent
    restart: unless-stopped
    depends_on:
      - agency
    environment:
      CHERRYPI_AGENCY_URL: http://agency:8080

      CHERRYPI_AGENT_TOKEN: ${CHERRYPI_AGENT_TOKEN:-}
    volumes:
      - ./cherrypi_home:/root
